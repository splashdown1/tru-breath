<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12161c">
<title>TRU BREATH</title>
<style>
:root{--bg:#12161c;--ink:#e8eef4;--dim:#a0b0c0;--line:#2a3440;--cool:#8ab4c8;--card:#1a222c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--cool)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c1016;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--cool);color:#12161c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--cool);font-size:12px;letter-spacing:.12em} .big{font-size:20px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>TRU <span>BREATH</span></h1>
  <p class="sub">Simple field rules for breath and quiet recovery. Not a medical protocol. A gap stays a gap.</p>
</header>
<div class="bar">
  <input id="q" placeholder="count, calm, recovery, quiet…" enterkeyhint="search">
  <button id="send">Send</button>
</div>
<main id="out"></main>
<script>
const B=[
{t:"Slow the count",d:"When the heart is racing from effort or fear, lengthen the out-breath. In for a count of four, out for a count of six or longer. Do not force. The longer out-breath is the part that settles the system."},
{t:"Through the nose when you can",d:"Nasal breathing filters, warms, and slows the air. Mouth breathing is faster and dries the throat. Prefer the nose unless the work or the air demands otherwise."},
{t:"Sit or lean before you force it",d:"If you are winded, stop the work and let the breath recover before the next push. Standing and panting is less efficient than a brief rest that lets the rate come down."},
{t:"Quiet recovery",d:"After hard work or a startle, find a place with less noise and less light if you can. Lower stimulation helps the breath and the attention settle together. Quiet is a tool, not a luxury."},
{t:"Buddy check",d:"In cold or heat, or after a scare, watch each other’s breathing. Rapid shallow breathing that does not settle, or a person who stops responding to the breath cue, is a signal to stop the task and get help."},
{t:"Do not hyperventilate on purpose",d:"Deliberate over-breathing can cause light-headedness and is not a field recovery method. Slow, even, and slightly longer on the out-breath is the useful pattern."},
{t:"Cold air",d:"In extreme cold, breathe through a scarf or the collar when possible so the air is less harsh. Dry cold air can irritate the airways; warming it a little helps."},
{t:"Gap",d:"No clinical protocol, no oxygen numbers, no panic-disorder treatment, no meditation system. Simple field habits only. If breath will not settle or the person is in distress, this card is finished."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function card(x){return `<article class="card"><div class="k">BREATH</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">Field habits only. Not a medical or clinical protocol. Quiet and recovery sit beside Watch and Cold.</div></article>`;}
function show(list){document.getElementById("out").innerHTML=list.map(card).join("");}
function search(q){
  q=(q||"").trim().toLowerCase();
  if(!q){show(B);return;}
  const hits=B.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q));
  document.getElementById("out").innerHTML=hits.length?hits.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No clinical protocol on this card. Simple field habits only.</div></article>`;
}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter")search(e.target.value);};
show(B);
</script>
</body>
</html>
